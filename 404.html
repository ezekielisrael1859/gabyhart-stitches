<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      try {
        var saved = localStorage.getItem("gh-theme");
        if (saved === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    })();
  </script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Gabyhart Stitches</title>
<link rel="icon" href="images/favicon.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo-mark">
      <span class="logo-mark__wordmark">GabyHart Stitches</span>
    </a>
  </div>
</header>
<main>
  <section class="section section--dark" style="padding-top: var(--space-3xl); text-align: center; min-height: 60vh; display: flex; flex-direction: column; justify-content: center;">
    <div class="container">
      <span class="eyebrow">404</span>
      <h1 class="display-heading hero-heading" style="font-size: var(--fs-h1);">Page Not Found</h1>
      <p style="max-width: 40ch; margin: var(--space-md) auto; color: var(--color-text-on-wash-muted);">
        The page you're looking for doesn't exist or may have moved.
      </p>
      <a href="index.html" class="btn btn--primary">Back to Home</a>
    </div>
  </section>
</main>
</body>
</html>
